[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm1-queue-simulation"
version = "0.1.0"
description = "Simulación de un sistema de líneas de espera M/M/1 mediante SimPy (APE 003)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
